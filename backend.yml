- name: Backend setup
  hosts: all
  become: yes
  tasks:
    - name: Disabla default nodejs
      ansible.builtin.shell: dnf module disable nodejs -y

    - name: enable nodejs
      ansible.builtin.shell: dnf module disable nodejs -y

    - name: install nodejs
      ansible.builtin.dnf:
        name: nodejs
        state: installed

    - name: adding applicantion user
      ansible.builtin.user:
        name: expense

    - name: Clean old app content
      ansible.builtin.file:
        path: /app
        state: absent

    - name: Recreate app directory
      ansible.builtin.file:
        path: /app
        state: directory


    - name: Download and extract app content
      ansible.builtin.unarchive:
        src: https://expense-artifacts.s3.amazonaws.com/expense-backend-v2.zip
        dest: /app
        remote_src: yes

    - name: nodejs dependencies
      community.general.npm:
        path: /app
        state: latest

    - name: copy backend servicefile
      ansible.builtin.copy:
        src: backend.service
        dest: /etc/systemd/system/backend.service

    - name: install mysql client
      ansible.builtin.dnf:
        name: mysql
        state: installed


    - name: load schema
      community.mysql.mysql_db:
        state: import
        name: all
        target: /app/schema/backend.sql
        login_user: root
        login_password: ExpenseApp@1
        login_host: mysql-dev.pdops.shop

    - name: start backend service
      ansible.builtin.systemd_service:
        name: backend
        state: restarted
        enabled: yes
        demon_reload: yes



